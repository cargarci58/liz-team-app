<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Tester Results — TransactAgent Pro</title>
<style>
  :root{
    --red:#b8232f; --red-dark:#8e1820; --gold:#c79a3a; --gold-soft:#f3e7c6;
    --ink:#2c2a28; --muted:#6b6560; --bg:#fbf7f0; --card:#fff; --line:#ece4d6;
    --green:#1f8a4c; --green-soft:#e4f4ea; --amber:#b9791b; --amber-soft:#fbefd6;
    --rose:#c0392b; --rose-soft:#fce8e6;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);margin:0;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px;}
  h1{font-size:22px;margin:0 0 4px;color:var(--red-dark);}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03);}
  label{font-weight:700;font-size:14px;display:block;margin:0 0 6px;}
  input{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;}
  button{background:var(--red);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;padding:12px 18px;cursor:pointer;}
  button.ghost{background:var(--gold-soft);color:var(--red-dark);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .err{color:var(--rose);font-weight:700;font-size:14px;margin-top:8px;}
  .session{border-left:5px solid var(--gold);}
  .session h3{margin:0 0 2px;font-size:17px;}
  .meta{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .tally{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{font-size:13px;font-weight:800;padding:4px 11px;border-radius:999px;}
  .chip.works{background:var(--green-soft);color:var(--green);}
  .chip.broken{background:var(--rose-soft);color:var(--rose);}
  .chip.confusing{background:var(--amber-soft);color:var(--amber);}
  .step{padding:9px 0;border-top:1px solid var(--line);}
  .step .v{font-weight:800;font-size:13px;padding:2px 9px;border-radius:999px;margin-right:8px;display:inline-block;}
  .v.works{background:var(--green-soft);color:var(--green);}
  .v.broken{background:var(--rose-soft);color:var(--rose);}
  .v.confusing{background:var(--amber-soft);color:var(--amber);}
  .v.skipped,.v.none{background:#eee;color:#888;}
  .step .t{font-weight:700;}
  .step .note{margin-top:4px;font-size:14px;background:#fff8ea;border:1px dashed var(--gold);border-radius:8px;padding:7px 10px;white-space:pre-wrap;}
  .empty{color:var(--muted);text-align:center;padding:30px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar button{font-size:13px;padding:8px 13px;}
  .summary{background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px;}
  .summary b{color:var(--red-dark);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐞 Tester Results</h1>
  <p class="sub">Sign in with your TransactAgent Pro login to read what your testers reported.</p>

  <div class="card" id="loginCard">
    <label for="email">Email</label>
    <input type="text" id="email" autocomplete="username" placeholder="you@brokerage.com" />
    <div style="height:12px"></div>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
    <div style="height:14px"></div>
    <button id="loginBtn">Sign in &amp; load results</button>
    <div class="err" id="loginErr" style="display:none;"></div>
  </div>

  <div id="results" style="display:none;">
    <div class="toolbar">
      <button class="ghost" id="reload">↻ Reload</button>
      <button class="ghost" id="onlyProblems">⚠️ Only show problems</button>
      <button class="ghost" id="copyJson">📋 Copy raw JSON</button>
    </div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API = "https://liz-team-server-api-production.up.railway.app";
  var token = sessionStorage.getItem("tap_admin_token") || "";
  var DATA = null, problemsOnly = false;

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(d){ try{ return new Date(d).toLocaleString(); }catch(e){ return d; } }

  function login(){
    var email = document.getElementById("email").value.trim();
    var pw = document.getElementById("password").value;
    var err = document.getElementById("loginErr");
    err.style.display="none";
    fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:email,password:pw})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        if(!res.ok || !res.j.token){ throw new Error(res.j.error || "Login failed."); }
        token = res.j.token;
        sessionStorage.setItem("tap_admin_token", token);
        load();
      })
      .catch(function(e){ err.textContent = e.message || "Login failed."; err.style.display="block"; });
  }

  function load(){
    fetch(API+"/admin/tester/responses",{headers:{Authorization:"Bearer "+token}})
      .then(function(r){
        if(r.status===401||r.status===403){ sessionStorage.removeItem("tap_admin_token"); token=""; throw new Error("auth"); }
        return r.json();
      })
      .then(function(j){
        DATA = j;
        document.getElementById("loginCard").style.display="none";
        document.getElementById("results").style.display="block";
        render();
      })
      .catch(function(e){
        document.getElementById("loginCard").style.display="block";
        document.getElementById("results").style.display="none";
        if(e.message==="auth"){
          var err=document.getElementById("loginErr"); err.textContent="Session expired — sign in again."; err.style.display="block";
        }
      });
  }

  function render(){
    var sessions = (DATA && DATA.sessions) || [];
    var list = document.getElementById("list");
    // overall tally
    var tot={works:0,broken:0,confusing:0,skipped:0}, testers=sessions.length;
    sessions.forEach(function(s){ for(var k in tot){ tot[k]+= (s.counts&&s.counts[k])||0; } });
    document.getElementById("summary").innerHTML =
      "<b>"+testers+"</b> testing session"+(testers===1?"":"s")+" • "+
      "👍 "+tot.works+" worked • 🐞 "+tot.broken+" broken • 😕 "+tot.confusing+" confusing";

    if(!sessions.length){ list.innerHTML='<div class="empty">No tester responses yet. Share <b>/tester</b> and check back.</div>'; return; }

    var html="";
    sessions.forEach(function(s){
      var steps = s.steps||[];
      if(problemsOnly) steps = steps.filter(function(x){ return x.verdict==="broken"||x.verdict==="confusing"; });
      if(problemsOnly && !steps.length) return;
      html += '<div class="card session">'+
        '<h3>'+ esc(s.tester_name||"Anonymous tester") +'</h3>'+
        '<div class="meta">'+ esc(s.device||"unknown device") +' • '+ fmt(s.started_at) +
          (s.last_at&&s.last_at!==s.started_at? ' → '+fmt(s.last_at):'') +'</div>'+
        '<div class="tally">'+
          chip("works","👍 "+(s.counts.works||0)+" worked")+
          chip("broken","🐞 "+(s.counts.broken||0)+" broken")+
          chip("confusing","😕 "+(s.counts.confusing||0)+" confusing")+
        '</div>';
      steps.forEach(function(st){
        var v = st.verdict||"none";
        var label = v==="works"?"WORKS":v==="broken"?"BROKEN":v==="confusing"?"CONFUSING":(v==="none"?"—":v.toUpperCase());
        html += '<div class="step">'+
          '<span class="v '+v+'">'+label+'</span>'+
          '<span class="t">'+ esc(st.step_title||st.step_key) +'</span>'+
          (st.note? '<div class="note">'+ esc(st.note) +'</div>':'')+
        '</div>';
      });
      html += '</div>';
    });
    list.innerHTML = html || '<div class="empty">No problems reported yet 🎉</div>';
  }
  function chip(cls,txt){ return '<span class="chip '+cls+'">'+txt+'</span>'; }

  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("password").addEventListener("keydown", function(e){ if(e.key==="Enter") login(); });
  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("onlyProblems").addEventListener("click", function(){
    problemsOnly = !problemsOnly;
    this.textContent = problemsOnly ? "📋 Show all" : "⚠️ Only show problems";
    render();
  });
  document.getElementById("copyJson").addEventListener("click", function(){
    try{ navigator.clipboard.writeText(JSON.stringify(DATA,null,2)); this.textContent="✓ Copied"; var b=this; setTimeout(function(){b.textContent="📋 Copy raw JSON";},1500);}catch(e){}
  });

  if(token){ load(); }
})();
</script>
</body>
</html>
