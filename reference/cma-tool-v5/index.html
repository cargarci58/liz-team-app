<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Liz Team — CMA Pricing Intelligence v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --ink: #0f1419; --ink-soft: #2a3340;
    --paper: #faf7f2; --paper-deep: #f1ece3;
    --rule: #d8d0c2; --accent: #8b3a1f; --accent-soft: #c45a37;
    --gold: #b8924a; --green: #4a6b3e; --red: #9d3535; --blue: #2c5777;
    --muted: #6b6357;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Inter Tight', sans-serif; min-height: 100vh; }
  body { background-image: radial-gradient(circle at 15% 20%, rgba(184,146,74,0.04) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(139,58,31,0.03) 0%, transparent 40%); }
  .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px) { .container { padding: 0 16px; } }

  .masthead { border-bottom: 2px solid var(--ink); padding: 22px 0; margin-bottom: 32px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); background: rgba(250, 247, 242, 0.92); }
  .masthead-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .brand { font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px; letter-spacing: -0.03em; }
  .brand-mark { color: var(--accent); }
  .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--muted); margin-top: 4px; }
  .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mode-toggle { display: inline-flex; background: white; border: 1px solid var(--rule); border-radius: 2px; padding: 3px; }
  .mode-btn { padding: 7px 14px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: transparent; border: none; cursor: pointer; color: var(--muted); border-radius: 2px; transition: all 0.15s; }
  .mode-btn.active { background: var(--ink); color: var(--paper); }

  .section { margin-bottom: 56px; }
  .section-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
  .section-title { font-family: 'Fraunces', serif; font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 12px; }
  .section-sub { color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 720px; margin-bottom: 28px; }

  .upload-zone { border: 2px dashed var(--rule); border-radius: 4px; padding: 56px 32px; text-align: center; background: var(--paper-deep); transition: all 0.2s; cursor: pointer; }
  .upload-zone:hover { border-color: var(--accent); background: #f5efe2; }
  .upload-zone.drag { border-color: var(--accent); background: #f0e7d4; }
  .upload-zone svg { color: var(--accent); margin-bottom: 16px; }
  .upload-zone .primary { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  .upload-zone .secondary { color: var(--muted); font-size: 14px; }
  input[type="file"] { display: none; }

  .form-card { background: white; padding: 28px; border: 1px solid var(--rule); border-radius: 2px; margin-bottom: 20px; }
  .form-card-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .form-card-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .field-label .opt { color: #b8a48a; font-weight: normal; text-transform: none; letter-spacing: normal; font-family: 'Inter Tight'; font-style: italic; font-size: 11px; margin-left: 4px; }
  .field input, .field select { border: none; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 8px 0; font-family: 'Inter Tight', sans-serif; font-size: 16px; color: var(--ink); outline: none; transition: border-color 0.2s; width: 100%; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input::placeholder { color: #bbb; font-style: italic; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; padding: 14px 0 6px; }
  .checkbox-field input { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkbox-field label { font-size: 14px; color: var(--ink-soft); cursor: pointer; }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; font-family: 'Inter Tight'; font-weight: 500; font-size: 13px; letter-spacing: 0.02em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; border-radius: 2px; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover:not(:disabled) { background: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); font-size: 11px; padding: 8px 14px; }
  .btn-danger:hover { background: var(--red); color: var(--paper); }
  .btn-mini { padding: 6px 12px; font-size: 11px; letter-spacing: 0.1em; border: 1px solid var(--rule); background: transparent; color: var(--ink-soft); cursor: pointer; border-radius: 2px; transition: all 0.15s; }
  .btn-mini:hover { border-color: var(--accent); color: var(--accent); }

  /* MLS Guide collapsible */
  .mls-guide { background: #faf3e3; border: 1px solid var(--gold); border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
  .mls-guide-header { padding: 14px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
  .mls-guide-header:hover { background: #f5ead0; }
  .mls-guide-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: var(--ink); }
  .mls-guide-icon { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 600; }
  .mls-guide-body { padding: 0 24px 20px; font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
  .mls-guide-body h4 { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: var(--ink); margin: 16px 0 8px; }
  .mls-guide-body table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .mls-guide-body th, .mls-guide-body td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #ead9b6; }
  .mls-guide-body th { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .mls-guide-body td { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .mls-guide-body td:first-child { font-weight: 500; color: var(--ink); }
  .mls-guide-body ul { margin: 8px 0 8px 20px; }
  .mls-guide-body li { margin-bottom: 4px; }
  .mls-guide-body code { background: white; padding: 2px 6px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); }

  /* Data health */
  .health-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: white; border: 1px solid var(--rule); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  .health-stat { text-align: center; padding: 18px 12px; border-right: 1px solid #f0ebe0; }
  .health-stat:last-child { border-right: none; }
  .health-stat-val { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; line-height: 1; }
  .health-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .health-stat.sold .health-stat-val { color: var(--green); }
  .health-stat.act .health-stat-val { color: var(--blue); }
  .health-stat.pnd .health-stat-val { color: var(--gold); }
  .health-stat.exp .health-stat-val { color: var(--red); }

  .data-warning { background: #f7e6e1; border-left: 3px solid var(--red); padding: 14px 18px; margin: 14px 0; font-size: 13px; line-height: 1.55; color: var(--ink-soft); border-radius: 2px; }
  .data-warning strong { color: var(--red); }
  .data-info { background: #e6eef3; border-left: 3px solid var(--blue); padding: 14px 18px; margin: 14px 0; font-size: 13px; line-height: 1.55; color: var(--ink-soft); border-radius: 2px; }
  .data-info strong { color: var(--blue); }
  .data-good { background: #ebf0e6; border-left: 3px solid var(--green); padding: 14px 18px; margin: 14px 0; font-size: 13px; line-height: 1.55; color: var(--ink-soft); border-radius: 2px; }
  .data-good strong { color: var(--green); }

  /* Status pills */
  .status-pill { display: inline-block; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; font-weight: 600; border-radius: 2px; }
  .status-sld { background: #d9e7d2; color: #2d4423; }
  .status-pnd { background: #f4e3c3; color: #6b4f1a; }
  .status-act { background: #d2dfeb; color: #1a3a55; }
  .status-exp { background: #ecccc4; color: #5a1f15; }

  .outlier-flag { display: inline-block; background: var(--red); color: white; padding: 1px 6px; font-size: 9px; font-family: 'JetBrains Mono', monospace; font-weight: 600; border-radius: 2px; margin-left: 6px; letter-spacing: 0.05em; }

  /* Comp table */
  .comp-table-wrap { background: white; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
  .comp-controls { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--rule); background: var(--paper-deep); flex-wrap: wrap; gap: 12px; }
  .comp-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .comp-count strong { color: var(--accent); font-weight: 600; }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; background: white; border: 1px solid var(--rule); border-radius: 100px; font-size: 11px; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all 0.15s; }
  .filter-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .filter-chip:hover:not(.active) { border-color: var(--accent); }
  .comp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .comp-table th { text-align: left; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); background: white; font-weight: 500; position: sticky; top: 0; }
  .comp-table td { padding: 11px 12px; border-bottom: 1px solid #f0ebe0; color: var(--ink-soft); }
  .comp-table tbody tr { transition: background 0.1s; cursor: pointer; }
  .comp-table tbody tr:hover { background: var(--paper-deep); }
  .comp-table tbody tr.selected { background: #f5e9d4; }
  .comp-table tbody tr.selected td { color: var(--ink); font-weight: 500; }
  .comp-table tbody tr.outlier { background: #faeae3; }
  .comp-table tbody tr.outlier.selected { background: #f5d4c4; }
  .comp-table-scroll { max-height: 460px; overflow-y: auto; }
  .comp-table input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  .addr-cell { font-weight: 500; color: var(--ink); }
  .price-cell { font-family: 'JetBrains Mono', monospace; font-weight: 500; }

  /* Verdict */
  .verdict-card { background: linear-gradient(180deg, var(--ink) 0%, #1a2129 100%); color: var(--paper); padding: 44px 36px; border-radius: 2px; margin-bottom: 32px; position: relative; overflow: hidden; }
  .verdict-card::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 80% 20%, rgba(184,146,74,0.12) 0%, transparent 50%); }
  .verdict-card-inner { position: relative; }
  .verdict-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
  .verdict-price { font-family: 'Fraunces', serif; font-size: clamp(44px, 7vw, 80px); font-weight: 600; letter-spacing: -0.03em; line-height: 1; margin-bottom: 14px; }
  .verdict-sub { font-size: 15px; line-height: 1.6; color: #c8c2b6; max-width: 580px; }
  .verdict-sub strong { color: var(--gold); }
  .verdict-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 24px; margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.15); }
  .verdict-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .verdict-stat-value { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; }

  /* Adjustments breakdown */
  .adj-card { background: white; border: 1px solid var(--rule); border-radius: 2px; padding: 24px 28px; margin-bottom: 20px; }
  .adj-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .adj-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0ebe0; }
  .adj-row:last-child { border-bottom: none; }
  .adj-row.base { padding: 6px 0 12px; margin-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .adj-row.total { padding: 14px 0 4px; margin-top: 8px; border-top: 2px solid var(--ink); border-bottom: none; font-weight: 600; }
  .adj-label { font-size: 14px; color: var(--ink-soft); }
  .adj-label .source { font-size: 11px; color: var(--muted); margin-left: 6px; font-family: 'JetBrains Mono', monospace; }
  .adj-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; }
  .adj-value.pos { color: var(--green); }
  .adj-value.neg { color: var(--red); }
  .adj-row.total .adj-label { font-size: 16px; font-weight: 600; color: var(--ink); }
  .adj-row.total .adj-value { font-size: 18px; color: var(--ink); }

  /* Tier cards */
  .tier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .tier-card { background: white; border: 1px solid var(--rule); border-radius: 2px; padding: 26px 22px; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
  .tier-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  .tier-card.market { border-color: var(--accent); border-width: 2px; }
  .tier-card.market::before { content: 'RECOMMENDED'; position: absolute; top: -10px; left: 22px; background: var(--accent); color: var(--paper); padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.15em; border-radius: 2px; }
  .tier-name { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .tier-price { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 4px; }
  .tier-psf { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 14px; }
  .tier-meta { font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
  .tier-meta-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f3eee2; }
  .tier-meta-row:last-child { border-bottom: none; }
  .tier-meta-row .label { color: var(--muted); }
  .tier-meta-row .val { font-weight: 500; font-family: 'JetBrains Mono', monospace; }

  .dom-table-wrap { background: white; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .dom-table { width: 100%; border-collapse: collapse; }
  .dom-table th, .dom-table td { padding: 13px 16px; text-align: left; font-size: 14px; }
  .dom-table th { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .dom-table td { border-bottom: 1px solid #f3eee2; color: var(--ink-soft); }
  .dom-table tr:last-child td { border-bottom: none; }
  .dom-table .price-col { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--ink); }
  .dom-table .prob-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--paper-deep); width: 80px; position: relative; overflow: hidden; margin-right: 8px; vertical-align: middle; }
  .dom-table .prob-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 3px; }

  .carry-wrap { background: white; border: 1px solid var(--rule); border-radius: 2px; padding: 28px; }
  .carry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 22px; margin-bottom: 20px; }
  .carry-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .carry-stat-val { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; }
  .carry-stat-val.danger { color: var(--red); }
  .carry-narrative { padding-top: 18px; border-top: 1px solid var(--rule); font-size: 14px; line-height: 1.7; color: var(--ink-soft); }

  .upgrade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .upgrade-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--paper-deep); border: 1px solid transparent; border-radius: 2px; cursor: pointer; transition: all 0.15s; }
  .upgrade-row:hover { border-color: var(--rule); }
  .upgrade-row.active { background: #f5e9d4; border-color: var(--accent); }
  .upgrade-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .upgrade-info { flex: 1; }
  .upgrade-name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .upgrade-meta { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .upgrade-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--accent); }

  .insight { background: #faf3e3; border-left: 3px solid var(--gold); padding: 18px 22px; margin: 18px 0; font-size: 14px; line-height: 1.65; color: var(--ink-soft); }
  .insight strong { color: var(--ink); font-weight: 600; }
  .insight.warn { background: #f7e6e1; border-color: var(--accent); }
  .insight.good { background: #ebf0e6; border-color: var(--green); }

  /* Buyer agent outreach */
  .agent-list { background: white; border: 1px solid var(--rule); border-radius: 2px; padding: 0; overflow: hidden; }
  .agent-row { padding: 14px 20px; border-bottom: 1px solid #f0ebe0; display: flex; justify-content: space-between; align-items: center; }
  .agent-row:last-child { border-bottom: none; }
  .agent-name { font-weight: 500; color: var(--ink); font-size: 14px; }
  .agent-meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
  .agent-count { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent); }

  /* Inventory health card */
  .inv-card { background: white; border: 1px solid var(--rule); border-radius: 2px; padding: 24px 28px; }
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; margin-bottom: 16px; }
  .inv-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .inv-stat-val { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; }
  .inv-verdict { padding-top: 16px; border-top: 1px solid var(--rule); font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
  .inv-verdict strong { color: var(--ink); }

  .footer { margin-top: 80px; padding: 24px 0; border-top: 1px solid var(--rule); text-align: center; color: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }

  /* ===== SELLER REPORT — INK-FRIENDLY EDITORIAL DESIGN ===== */
  /* Palette: white + black + grays + minimal red accent. Drama from typography, not color. */
  .sr-page { background: white; max-width: 920px; margin: 0 auto 40px; padding: 0; box-shadow: 0 4px 32px rgba(0,0,0,0.08); }

  /* COVER — minimal, magazine cover style */
  .sr-cover { background: white; padding: 80px 60px 56px; border-bottom: 4px solid #000; position: relative; }
  .sr-cover::before { content: ''; position: absolute; top: 30px; left: 60px; right: 60px; height: 1px; background: #000; }
  .sr-cover-inner { position: relative; }
  .sr-brand { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; color: #000; margin-bottom: 6px; text-transform: uppercase; }
  .sr-brand .mark { color: #c8102e; }

const { useState, useMemo, useRef } = React;

// ===== HELPERS =====
const fmtMoney = (n) => n == null || isNaN(n) ? '—' : '$' + Math.round(n).toLocaleString();
const fmtMoneySigned = (n) => {
  if (n == null || isNaN(n)) return '—';
  const sign = n >= 0 ? '+' : '−';
  return sign + '$' + Math.abs(Math.round(n)).toLocaleString();
};
const fmtPct = (n, d=1) => n == null || isNaN(n) ? '—' : (n*100).toFixed(d) + '%';
const fmtPsf = (n) => n == null || isNaN(n) ? '—' : '$' + n.toFixed(0) + '/sqft';
const cleanMoney = (s) => {
  if (s == null || s === '') return null;
  const v = parseFloat(String(s).replace(/[$,]/g,''));
  return isNaN(v) ? null : v;
};
const cleanNum = (s) => {
  if (s == null || s === '') return null;
  const v = parseFloat(String(s).replace(/,/g,''));
  return isNaN(v) ? null : v;
};

// Stats helpers
const median = (arr) => {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const m = Math.floor(s.length/2);
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
};
const mean = (arr) => arr.length ? arr.reduce((s,v)=>s+v,0) / arr.length : 0;
const percentile = (arr, p) => {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const idx = Math.min(Math.floor(s.length * p), s.length - 1);
  return s[idx];
};

// Round to defensible psychological breakpoints
const roundPrice = (n) => {
  if (n == null || isNaN(n)) return n;
  if (n >= 1000000) {
    // Round to nearest $25K for $1M+
    return Math.round(n / 25000) * 25000 - 1000;
  } else if (n >= 500000) {
    // Round to nearest $5K for $500K-$1M, subtract 1
    return Math.round(n / 5000) * 5000 - 1000;
  } else {
    // Round to nearest $5K for under $500K
    return Math.round(n / 5000) * 5000 - 1000;
  }
};

// Pool classification: 'private', 'community', 'none'
const classifyPool = (poolStr) => {
  if (!poolStr) return 'none';
  const s = poolStr.toLowerCase();
  if (s.includes('private')) return 'private';
  if (s.includes('community')) return 'community';
  if (s.includes('none') || s.trim() === '') return 'none';
  return 'none';
};

// Stories classification: 1 or 2

  if (!str) return null;

// ===== TREND CHART COMPONENT =====
function TrendChart({ points }) {
  if (!points || points.length < 2) return null;
  const width = 760, height = 180, padding = 36;
  const xs = points.map(p => p.date.getTime());
  const ys = points.map(p => p.psf);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys) * 0.95, yMax = Math.max(...ys) * 1.05;
  const xScale = (x) => padding + ((x - xMin) / (xMax - xMin)) * (width - padding * 2);
  const yScale = (y) => height - padding - ((y - yMin) / (yMax - yMin)) * (height - padding * 2);
  const n = points.length;
  const meanX = xs.reduce((s,v)=>s+v,0) / n;
  const meanYv = ys.reduce((s,v)=>s+v,0) / n;
  const num = xs.reduce((s, x, i) => s + (x - meanX) * (ys[i] - meanYv), 0);
  const den = xs.reduce((s, x) => s + Math.pow(x - meanX, 2), 0);
  const slope = den > 0 ? num / den : 0;
  const intercept = meanYv - slope * meanX;
  const lineY1 = intercept + slope * xMin;
  const lineY2 = intercept + slope * xMax;
  const trendUp = lineY2 > lineY1;
  const trendColor = trendUp ? '#4a6b3e' : '#9d3535';
  const fmtDate = (d) => `${d.getMonth()+1}/${String(d.getFullYear()).slice(-2)}`;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width:'100%', height:'auto', maxHeight:200 }}>
      <line x1={padding} y1={padding} x2={padding} y2={height-padding} stroke="#d8d0c2" strokeWidth="1" />
      <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="#d8d0c2" strokeWidth="1" />
      <text x={padding-6} y={padding+4} textAnchor="end" fontSize="10" fill="#6b6357" fontFamily="JetBrains Mono">${yMax.toFixed(0)}</text>
      <text x={padding-6} y={height-padding+4} textAnchor="end" fontSize="10" fill="#6b6357" fontFamily="JetBrains Mono">${yMin.toFixed(0)}</text>
      <text x={padding} y={height-padding+18} textAnchor="start" fontSize="10" fill="#6b6357" fontFamily="JetBrains Mono">{fmtDate(new Date(xMin))}</text>
      <text x={width-padding} y={height-padding+18} textAnchor="end" fontSize="10" fill="#6b6357" fontFamily="JetBrains Mono">{fmtDate(new Date(xMax))}</text>
      <line x1={xScale(xMin)} y1={yScale(lineY1)} x2={xScale(xMax)} y2={yScale(lineY2)} stroke={trendColor} strokeWidth="2" strokeDasharray="4 4" opacity="0.7" />
      {points.map((p, i) => (
        <circle key={i} cx={xScale(p.date.getTime())} cy={yScale(p.psf)} r="4" fill="#8b3a1f" />
      ))}
    </svg>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null, errorInfo: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    this.setState({ errorInfo });
    console.error('CMA Tool Error:', error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ minHeight: '100vh', background: '#faf7f2', padding: 40 }}>
          <div style={{ maxWidth: 800, margin: '0 auto', background: 'white', border: '2px solid #c8102e', padding: 40, borderRadius: 4 }}>
            <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 32, fontWeight: 700, color: '#c8102e', marginBottom: 16 }}>Something went wrong</h1>
            <p style={{ fontSize: 16, lineHeight: 1.6, color: '#222', marginBottom: 24 }}>
              The tool hit an unexpected error and couldn't continue. Your data is still in memory but you'll need to reload the page to start fresh. Below is the technical detail — if this keeps happening, send me a screenshot of this message and I'll fix it.
            </p>
            <div style={{ background: '#f7e6e1', border: '1px solid #d4a89a', padding: 16, borderRadius: 4, marginBottom: 24, fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: '#5a1f15', wordBreak: 'break-word' }}>
              <strong>Error:</strong> {this.state.error?.message || String(this.state.error)}
              {this.state.error?.stack && (
                <details style={{ marginTop: 12 }}>
                  <summary style={{ cursor: 'pointer', fontWeight: 600 }}>Stack trace (click to expand)</summary>
                  <pre style={{ fontSize: 11, whiteSpace: 'pre-wrap', marginTop: 8 }}>{this.state.error.stack}</pre>
                </details>
              )}
            </div>
            <button onClick={() => window.location.reload()} style={{ padding: '12px 24px', background: '#0f1419', color: 'white', border: 'none', borderRadius: 2, fontFamily: "'Inter Tight'", fontSize: 13, fontWeight: 500, letterSpacing: '0.05em', textTransform: 'uppercase', cursor: 'pointer' }}>Reload page</button>
            <button onClick={() => this.setState({ hasError: false, error: null, errorInfo: null })} style={{ padding: '12px 24px', background: 'transparent', color: '#0f1419', border: '1px solid #0f1419', borderRadius: 2, fontFamily: "'Inter Tight'", fontSize: 13, fontWeight: 500, letterSpacing: '0.05em', textTransform: 'uppercase', cursor: 'pointer', marginLeft: 12 }}>Try again</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

            cdom: cleanNum(row['CDOM']),
            adom: cleanNum(row['ADOM']),

            listAgent: row['List Agent'] || '',
            sellingAgent: row['Selling Agent'] || '',
            closeDate: row['Close Date'] || '',

          };

          c.hasPool = c.poolType === 'private';

          c.hasGolfView = !!(c.view && c.view.toLowerCase().includes('golf'));
          c.impliedListPrice = c.lpSqft && c.sqft ? c.lpSqft * c.sqft : null;
          c.spLpRatio = (c.impliedListPrice && c.currentPrice && c.status === 'SLD') ? c.currentPrice / c.impliedListPrice : null;
          c.effectivePsf = c.spSqft || c.lpSqft;
          return c;
        }).filter(c => c.address && c.sqft && (c.currentPrice || c.effectivePsf));
        setComps(parsed);
        setSelectedIds(new Set());
      }
    });
  };

  const filteredComps = useMemo(() => {
    if (!comps.length) return [];
    return comps.filter(c => {
      if (!statusFilter[c.status]) return false;
      if (filters.similarSize && subject.sqft) {
        const target = parseFloat(subject.sqft);
        if (target && c.sqft) {
          const pct = Math.abs(c.sqft - target) / target;
          if (pct > 0.20) return false;
        }
      }
      const tw = parseInt(filters.timeWindow);
      if (tw && c.closeDate && c.status === 'SLD') {
        const parts = c.closeDate.split('/');
        if (parts.length === 3) {
          const d = new Date(parts[2], parts[0]-1, parts[1]);
          const monthsAgo = (Date.now() - d.getTime()) / (1000*60*60*24*30);
          if (monthsAgo > tw) return false;
        }
      }
      return true;
    });
  }, [comps, filters, statusFilter, subject.sqft]);

  const selected = comps.filter(c => selectedIds.has(c.id));

  const healthStats = useMemo(() => {
    const stats = { SLD: 0, PND: 0, ACT: 0, EXP: 0 };
    selected.forEach(c => { if (stats[c.status] !== undefined) stats[c.status]++; });
    return stats;
  }, [selected]);

  // Outlier detection (MAD)
  const outlierInfo = useMemo(() => {
    const psfValues = selected.map(c => c.effectivePsf).filter(v => v != null);
    if (psfValues.length < 3) return { outlierIds: new Set(), details: [] };
    const med = median(psfValues);
    const deviations = psfValues.map(v => Math.abs(v - med));
    const mad = median(deviations);
    const threshold = mad > med * 0.05 ? mad * 2.5 : med * 0.40;
    const outlierIds = new Set();
    const details = [];
    selected.forEach(c => {
      if (c.effectivePsf == null) return;
      const dev = Math.abs(c.effectivePsf - med);
      if (dev > threshold) {
        outlierIds.add(c.id);
        details.push({
          id: c.id, address: c.address, psf: c.effectivePsf,
          devPct: ((c.effectivePsf - med) / med) * 100,
          direction: c.effectivePsf > med ? 'high' : 'low'
        });
      }
    });
    return { outlierIds, details, medianPsf: med };
  }, [selected]);

  // Market direction
  const marketDirection = useMemo(() => {
    if (marketOverride !== 'auto') {
      const overrides = {
        'rising': { annualPct: 0.08, label: 'Rising', desc: 'Manually set: market is appreciating', confidence: 'manual', dataPoints: 0 },
        'flat': { annualPct: 0, label: 'Flat', desc: 'Manually set: market is stable', confidence: 'manual', dataPoints: 0 },
        'softening_mild': { annualPct: -0.04, label: 'Softening', desc: 'Manually set: market is softening', confidence: 'manual', dataPoints: 0 },
        'softening_strong': { annualPct: -0.10, label: 'Falling', desc: 'Manually set: market is falling', confidence: 'manual', dataPoints: 0 }
      };
      return overrides[marketOverride];
    }
    const dated = selected
      .filter(c => c.status === 'SLD' && c.spSqft && c.closeDate && !outlierInfo.outlierIds.has(c.id))
      .map(c => {
        const parts = c.closeDate.split('/');
        if (parts.length !== 3) return null;
        return { date: new Date(parts[2], parts[0]-1, parts[1]), psf: c.spSqft };
      })
      .filter(x => x && !isNaN(x.date.getTime()));
    if (dated.length < 6) {
      return { annualPct: 0, label: 'Insufficient data', desc: `Need at least 6 sold comps with close dates for reliable trend detection (you have ${dated.length}). Use Manual Override below to set direction.`, confidence: 'none', dataPoints: dated.length };
    }
    dated.sort((a,b) => a.date - b.date);
    const oldestDate = dated[0].date;
    const newestDate = dated[dated.length-1].date;
    const spanDays = (newestDate - oldestDate) / (1000*60*60*24);
    if (spanDays < 60) return { annualPct: 0, label: 'Period too short', desc: 'Comps span less than 60 days.', confidence: 'none', dataPoints: dated.length };
    const mid = Math.floor(dated.length / 2);
    const firstHalf = dated.slice(0, mid);
    const secondHalf = dated.slice(mid);
    const meanPsf = (arr) => arr.reduce((s,v)=>s+v.psf, 0) / arr.length;
    const firstMean = meanPsf(firstHalf);
    const secondMean = meanPsf(secondHalf);
    const totalChange = (secondMean - firstMean) / firstMean;
    const midFirst = firstHalf[Math.floor(firstHalf.length/2)].date;
    const midSecond = secondHalf[Math.floor(secondHalf.length/2)].date;
    const yearsBetween = (midSecond - midFirst) / (1000*60*60*24*365);
    let annualPct = yearsBetween > 0 ? totalChange / yearsBetween : 0;
    // CAP extreme values — annualized rates beyond ±15% are almost always sample-size artifacts
    // (e.g., 4 comps with one outlier creating a wildly steep trend line)
    annualPct = Math.max(-0.15, Math.min(0.15, annualPct));
    let label, desc;
    if (annualPct > 0.05) { label = 'Rising'; desc = 'Sold prices are appreciating.'; }
    else if (annualPct > 0.02) { label = 'Slightly Rising'; desc = 'Modest appreciation in recent sales.'; }
    else if (annualPct > -0.02) { label = 'Flat'; desc = 'Market is stable.'; }
    else if (annualPct > -0.05) { label = 'Slightly Softening'; desc = 'Modest decline in recent sales.'; }
    else if (annualPct > -0.10) { label = 'Softening'; desc = 'Sold prices are declining noticeably.'; }
    else { label = 'Falling'; desc = 'Significant price decline detected.'; }
    const confidence = dated.length >= 8 ? 'strong' : 'moderate';
    return { annualPct, label, desc, confidence, dataPoints: dated.length, dated };
  }, [selected, marketOverride, outlierInfo]);

  // Upgrade adjustment
  const upgradeAdjustment = useMemo(() => {
    let total = 0;
    let breakdown = [];
    Object.entries(upgrades).forEach(([id, data]) => {
      if (!data?.checked) return;
      const item = UPGRADE_LIBRARY.find(u => u.id === id);
      if (!item) return;
      const cost = data.customValue != null && data.customValue !== '' ? parseFloat(data.customValue) : item.costFL;
      const value = cost * item.recovery;
      total += value;
      breakdown.push({ name: item.name, cost, recovery: item.recovery, value });
    });
    return { total, breakdown };
  }, [upgrades]);

  // ===== MAIN ANALYSIS =====
  const analysis = useMemo(() => {
    if (selected.length < 2 || !subject.sqft) return null;
    const targetSqft = parseFloat(subject.sqft);

    // Use cleaned comps (no outliers) for all calcs
    const cleanComps = selected.filter(c => !outlierInfo.outlierIds.has(c.id) && c.effectivePsf != null);
    if (cleanComps.length < 2) return null;

    const psfClean = cleanComps.map(c => c.effectivePsf);
    const medianPsf = median(psfClean);
    const p90Psf = percentile(psfClean, 0.90);
    const p10Psf = percentile(psfClean, 0.10);

    // List-to-sale ratio
    const soldRatios = cleanComps.filter(c => c.status === 'SLD').map(c => c.spLpRatio).filter(v => v != null);
    const medianRatio = soldRatios.length ? median(soldRatios) : 0.965;

    // DOM
    const soldAdoms = cleanComps.filter(c => c.status === 'SLD').map(c => c.adom).filter(v => v != null);
    const medianAdom = soldAdoms.length ? median(soldAdoms) : 45;

    // ===== ADJUSTMENT CALCULATIONS =====
    // Base: median $/sqft × subject sqft
    const baseValue = medianPsf * targetSqft;
    const adjustments = [];

    // POOL — directional logic with Florida rules of thumb as fallback
    // Real-world rule: private pools ADD value, community pools are roughly neutral,
    // no pool means $0 adjustment (or possibly small negative vs private-heavy comp sets).
    // If small-sample comp data shows the opposite of reality, ignore the noisy signal.
    const subjectPoolType = subject.poolType || 'none';
    const privatePoolPsf = cleanComps.filter(c => c.poolType === 'private').map(c => c.effectivePsf);
    const communityPoolPsf = cleanComps.filter(c => c.poolType === 'community').map(c => c.effectivePsf);
    const noPoolPsf = cleanComps.filter(c => c.poolType === 'none').map(c => c.effectivePsf);

    const privateMedian = privatePoolPsf.length >= 2 ? median(privatePoolPsf) : null;
    const communityMedian = communityPoolPsf.length >= 2 ? median(communityPoolPsf) : null;
    const noPoolMedian = noPoolPsf.length >= 2 ? median(noPoolPsf) : null;

    // Florida rule-of-thumb pool premium scaled to price band
    let flPoolPremium;
    if (baseValue >= 1500000) flPoolPremium = 50000;
    else if (baseValue >= 1000000) flPoolPremium = 40000;
    else if (baseValue >= 700000) flPoolPremium = 30000;
    else if (baseValue >= 500000) flPoolPremium = 22000;
    else flPoolPremium = 15000;

    // Cap data-driven pool adjustments to ±1.5× the rule-of-thumb
    // (prevents small-sample weirdness from generating unrealistic premiums)
    const poolCap = flPoolPremium * 1.5;

    let poolAdj = 0;
    let poolSource = '';

    if (subjectPoolType === 'private') {
      // Subject HAS a private pool - apply a premium
      if (privateMedian && (noPoolMedian || communityMedian)) {
        const otherMedian = noPoolMedian || communityMedian;
        const dataDrivenPsf = privateMedian - otherMedian;
        // Only use data signal if it's positive (the right direction)
        if (dataDrivenPsf > 0) {
          poolAdj = Math.min(dataDrivenPsf * targetSqft, poolCap);
          poolSource = `private pool premium from ${privatePoolPsf.length} pool comps vs ${(noPoolPsf.length + communityPoolPsf.length)} non-pool comps`;
        } else {
          // Data is noisy or backwards - use FL rule of thumb
          poolAdj = flPoolPremium;
          poolSource = `FL rule of thumb (comp data inconclusive)`;
        }
      } else {
        poolAdj = flPoolPremium;
        poolSource = `FL rule of thumb (insufficient pool/no-pool comps)`;
      }
    } else if (subjectPoolType === 'community') {
      // Community pool only - roughly neutral, very small adjustment at most
      // Don't apply a credit just because data shows it - community pool is amenity-tier, not value-tier
      poolAdj = 0;
      poolSource = '';
    } else if (subjectPoolType === 'none') {
      // Subject has NO pool - small negative adjustment IF comp set is heavy with private pools
      // Critically: never positive. No pool is never a premium feature.
      const privateCompShare = privatePoolPsf.length / Math.max(cleanComps.length, 1);
      if (privateCompShare >= 0.4 && privateMedian && noPoolMedian) {
        // Significant share of comps have private pools - subject loses some relative value
        const dataDrivenPsf = noPoolMedian - privateMedian;
        // Only use if data shows the EXPECTED direction (no-pool less than private)
        if (dataDrivenPsf < 0) {
          poolAdj = Math.max(dataDrivenPsf * targetSqft, -poolCap);
          poolSource = `no-pool discount vs private-pool-heavy comp set`;
        } else {
          // Data backwards - use small FL rule of thumb
          poolAdj = -flPoolPremium * 0.5;
          poolSource = `FL rule of thumb (comp data inconclusive)`;
        }
      }
      // If comp set is mostly no-pool/community, no adjustment needed - subject is normal for market
    }
    if (Math.abs(poolAdj) > 500) {
      adjustments.push({ name: 'Pool', value: poolAdj, source: poolSource });
    }

    // STORIES — capped so small-sample weirdness can't produce massive adjustments
    const subjStories = parseInt(subject.stories) || 1;
    const oneStoryComps = cleanComps.filter(c => c.stories === 1).map(c => c.effectivePsf);
    const twoStoryComps = cleanComps.filter(c => c.stories === 2).map(c => c.effectivePsf);
    let storyAdj = 0;
    let storySource = '';
    // Need at least 3 in each bucket for a reliable signal
    if (oneStoryComps.length >= 3 && twoStoryComps.length >= 3) {
      const oneStoryMedian = median(oneStoryComps);
      const twoStoryMedian = median(twoStoryComps);
      const subjStoryMedian = subjStories === 1 ? oneStoryMedian : twoStoryMedian;
      const rawAdj = (subjStoryMedian - medianPsf) * targetSqft;
      // Cap at ±5% of base value to prevent unrealistic adjustments
      const cap = baseValue * 0.05;
      storyAdj = Math.max(-cap, Math.min(cap, rawAdj));
      if (Math.abs(storyAdj) > 500) {
        storySource = `${subjStories}-story vs mixed comp set (${oneStoryComps.length} one-story, ${twoStoryComps.length} two-story)`;
        adjustments.push({ name: `${subjStories}-Story Adjustment`, value: storyAdj, source: storySource });
      }
    }

    // GARAGE — fixed per-space value
    const subjGarage = parseInt(subject.garageSpaces) || 2;
    const garageComps = cleanComps.filter(c => c.garageSpaces != null && c.garageSpaces > 0);
    let garageAdj = 0;
    if (garageComps.length >= 3) {
      const medianGarage = median(garageComps.map(c => c.garageSpaces));
      const garageDiff = subjGarage - medianGarage;
      const perSpaceValue = baseValue >= 1000000 ? 25000 : baseValue >= 600000 ? 18000 : 12000;
      garageAdj = garageDiff * perSpaceValue;
      if (Math.abs(garageAdj) > 500) {
        adjustments.push({ name: `Garage (${subjGarage} vs ${medianGarage} median)`, value: garageAdj, source: `${fmtMoney(perSpaceValue)}/space differential` });
      }
    }

    // LOT VIEW — capped and properly bounded
    // Florida pond/water view typically adds 3-5%, golf view 4-6%
    // Cap at modest dollar amounts that match real market behavior
    const waterViewComps = cleanComps.filter(c => c.hasWaterView).map(c => c.effectivePsf);
    const noViewComps = cleanComps.filter(c => !c.hasWaterView && !c.hasGolfView).map(c => c.effectivePsf);
    let viewAdj = 0;

    // Pond/water view premium - capped at 5% of base or $30K, whichever is lower
    if (subject.hasWaterView) {
      const waterViewCap = Math.min(baseValue * 0.05, 30000);
      if (waterViewComps.length >= 3 && noViewComps.length >= 3) {
        // Use data-driven adjustment but cap it
        const wvMed = median(waterViewComps);
        const nvMed = median(noViewComps);
        const dataAdj = (wvMed - nvMed) * targetSqft;
        // Only apply if positive (view should be a premium, not a discount)
        if (dataAdj > 0) {
          const cappedAdj = Math.min(dataAdj, waterViewCap);
          viewAdj += cappedAdj;
          adjustments.push({ name: 'Water View', value: cappedAdj, source: `from ${waterViewComps.length} water-view comps, capped at FL norms` });
        } else {
          // Data backward - use modest FL rule of thumb
          viewAdj += waterViewCap * 0.6;
          adjustments.push({ name: 'Water View', value: waterViewCap * 0.6, source: 'FL rule of thumb (3-5% pond/lake view premium)' });
        }
      } else {
        // Insufficient comp data - use FL rule of thumb
        viewAdj += waterViewCap * 0.6;
        adjustments.push({ name: 'Water View', value: waterViewCap * 0.6, source: 'FL rule of thumb (3-5% pond/lake view premium)' });
      }
    }

    // Golf view premium - capped at 6% of base or $40K
    if (subject.hasGolfView) {
      const golfViewCap = Math.min(baseValue * 0.06, 40000);
      const golfAdj = golfViewCap * 0.75; // moderate within the range
      viewAdj += golfAdj;
      adjustments.push({ name: 'Golf View', value: golfAdj, source: 'FL rule of thumb (4-6% golf view premium)' });
    }

    // BED/BATH MISMATCH — 3% per bedroom, capped
    const subjBeds = parseInt(subject.beds);
    const compBedsList = cleanComps.map(c => c.beds).filter(v => v != null);
    if (subjBeds && compBedsList.length >= 3) {
      const medianBeds = median(compBedsList);
      const bedDiff = subjBeds - medianBeds;
      if (Math.abs(bedDiff) >= 1) {
        const rawBedAdj = bedDiff * baseValue * 0.03; // 3% per bedroom
        // Cap at ±$25K per bedroom difference
        const cap = Math.abs(bedDiff) * 25000;
        const bedAdj = Math.max(-cap, Math.min(cap, rawBedAdj));
        adjustments.push({ name: `Bed Count (${subjBeds} vs ${medianBeds} median)`, value: bedAdj, source: '~3% per bedroom, capped' });
      }
    }

    // SQFT MISMATCH — smaller homes always have higher $/sqft
    // Only adjust if there's a meaningful mismatch (>15% different from comp avg)
    const meanCompSqft = mean(cleanComps.map(c => c.sqft).filter(v => v != null));
    const sqftDiffPct = (targetSqft - meanCompSqft) / meanCompSqft;
    if (Math.abs(sqftDiffPct) > 0.15) {
      // Modest correction - 0.2 multiplier instead of 0.3, capped at ±5% of base
      const rawSqftAdj = baseValue * (-sqftDiffPct * 0.2);
      const cap = baseValue * 0.05;
      const sqftAdj = Math.max(-cap, Math.min(cap, rawSqftAdj));
      if (Math.abs(sqftAdj) > 500) {
        adjustments.push({ name: `Sqft Size Adjustment`, value: sqftAdj, source: `subject ${sqftDiffPct > 0 ? 'larger' : 'smaller'} than comp avg, capped at 5%` });
      }
    }

    // CONDITION TIER — the biggest single adjustment, comes from the in-person walkthrough
    // The comp set's median assumes "move-in ready" - everything else adjusts from there
    const conditionAdjustments = {
      'premium': { pct: 0.07, label: 'Premium / Recently Renovated' },
      'move_in': { pct: 0.0, label: 'Move-In Ready' },
      'original_maintained': { pct: -0.04, label: 'Original but Maintained' },
      'needs_work': { pct: -0.10, label: 'Original + Needs Work' },
      'major_updates': { pct: -0.17, label: 'Major Updates Needed' }
    };
    const conditionTier = subject.conditionTier || 'move_in';
    const conditionInfo = conditionAdjustments[conditionTier];
    if (conditionInfo && Math.abs(conditionInfo.pct) > 0.001) {
      const conditionAdj = baseValue * conditionInfo.pct;
      adjustments.push({
        name: `Condition: ${conditionInfo.label}`,
        value: conditionAdj,
        source: `${conditionInfo.pct >= 0 ? '+' : ''}${(conditionInfo.pct * 100).toFixed(0)}% vs move-in-ready baseline`
      });
    }

    // LOT QUALITY — lot situation can swing 5-10% in either direction
    const lotAdjustments = {
      'premium': { pct: 0.05, label: 'Premium Lot' },
      'above_avg': { pct: 0.02, label: 'Above-Average Lot' },
      'standard': { pct: 0.0, label: 'Standard Lot' },
      'below_avg': { pct: -0.03, label: 'Below-Average Lot' },
      'problem': { pct: -0.07, label: 'Problem Lot' }
    };
    const lotTier = subject.lotQuality || 'standard';
    const lotInfo = lotAdjustments[lotTier];
    if (lotInfo && Math.abs(lotInfo.pct) > 0.001) {
      const lotAdj = baseValue * lotInfo.pct;
      adjustments.push({
        name: `Lot: ${lotInfo.label}`,
        value: lotAdj,
        source: `${lotInfo.pct >= 0 ? '+' : ''}${(lotInfo.pct * 100).toFixed(0)}% vs standard lot`
      });
    }

    // Sum all adjustments
    const totalAdjustments = adjustments.reduce((s,a) => s + a.value, 0);
    const upgradeBoost = upgradeAdjustment.total;

    // Pre-market-direction expected sale price
    const preAdjustedValue = baseValue + totalAdjustments + upgradeBoost;

    // Market direction forward adjustment
    const marketAdjFactor = (dom) => 1 + marketDirection.annualPct * (dom / 365);
    const expectedMarketRaw = preAdjustedValue;
    const expectedMarket = expectedMarketRaw * marketAdjFactor(medianAdom);

    // ===== TIER CALCULATION =====
    // CRITICAL: All three tiers should anchor to the SAME calculated expected sale price.
    // The tiers represent STRATEGY differences on the same home, not "what if this were a different house."
    // - Market: list at the price that nets the expected sale at normal velocity
    // - Aggressive: list 5-7% above market, hoping the strongest buyer pays the premium (slower DOM, higher risk)
    // - Quick Sale: list 3-5% below market, generating multiple offers fast (faster DOM, lower risk)

    // Market tier — the anchor
    const listMarketRaw = expectedMarket / medianRatio;
    const listMarket = roundPrice(listMarketRaw);

    // Aggressive: 6% above market list price. Expected sale stays near market expected sale
    // (because pricing high doesn't actually make buyers pay more — they negotiate down)
    // but with longer DOM and lower probability of clearing
    const listAggressive = roundPrice(listMarket * 1.06);
    // Aggressive expected sale: most of these will reduce, ending up ~2% above market sale
    const expectedAggressive = expectedMarket * 1.02;

    // Quick Sale: 4% below market list price. Expected sale ends up close to or slightly above
    // list because multiple-offer dynamics push it up
    const listQuick = roundPrice(listMarket * 0.96);
    // Quick sale expected sale: with multiple-offer pressure, often clears at list or 1-2% above
    const expectedQuick = listQuick * 1.01;

    const cappedAggressive = listAggressive;  // No longer needs capping since spread is built-in
    const aggressiveWasCapped = false;

    let tiers = [
      { name: 'Aggressive', listPrice: listAggressive, psf: listAggressive / targetSqft, expectedSale: expectedAggressive, expectedDom: Math.round(medianAdom * 2.2), prob60: 0.25, riskOfReduction: 0.70 },
      { name: 'Market', listPrice: listMarket, psf: listMarket / targetSqft, expectedSale: expectedMarket, expectedDom: Math.round(medianAdom), prob60: 0.65, riskOfReduction: 0.25 },
      { name: 'Quick Sale', listPrice: listQuick, psf: listQuick / targetSqft, expectedSale: expectedQuick, expectedDom: Math.round(medianAdom * 0.5), prob60: 0.90, riskOfReduction: 0.05 }
    ];

    // ===== CURRENT LISTING OVERRIDE =====
    // If subject is already on the market AND has failed at current price, override the tiers.
    // The market's actual behavior on the actual home beats any computed comp price.
    //
    // CRITICAL: Reductions are anchored to BOTH the failed list price AND the comp-supported
    // expected sale. We pick a reduction that respects both signals.
    let currentListingOverride = null;
    if (subject.isCurrentlyListed && subject.currentListPrice) {
      const currentPrice = parseFloat(subject.currentListPrice);
      const dom = parseInt(subject.currentDOM) || 0;
      const reductions = parseInt(subject.priceReductions) || 0;
      const showings = subject.showingActivity || 'moderate';
      const offers = subject.offersReceived || 'none';

      const referenceDom = Math.max(medianAdom, 30);
      const staleness = dom / referenceDom;

      let listingFailed = false;
      let failureReason = '';
      if (staleness >= 2.0 && (showings === 'low' || showings === 'none')) {
        listingFailed = true;
        failureReason = `Listed ${dom} days (${staleness.toFixed(1)}x normal DOM) with low showing activity`;
      } else if (staleness >= 1.5 && offers === 'none' && showings !== 'high') {
        listingFailed = true;
        failureReason = `Listed ${dom} days (${staleness.toFixed(1)}x normal DOM) with no offers received`;
      } else if (staleness >= 2.5) {
        listingFailed = true;
        failureReason = `Listed ${dom} days — significantly above normal DOM`;
      }

      // ===== STALENESS DEPTH =====
      // How DEEPLY stale is this listing? A home that's already had $44K in failed
      // reductions is in much worse shape than one with no prior reductions.
      // The deeper the staleness, the more aggressive the next reduction must be —
      // because gentle reductions have already been tried and rejected.
      const reductionAmount = reductions;
      const originalListPrice = currentPrice + reductionAmount;
      const reductionPctSoFar = reductionAmount > 0 ? reductionAmount / originalListPrice : 0;

      // Staleness depth: 'barely', 'moderate', or 'deeply'
      let stalenessDepth = 'barely';
      if (listingFailed) {
        // Combine DOM signal + prior reduction signal
        const domSignal = staleness >= 2.0 ? 2 : staleness >= 1.5 ? 1 : 0;
        const reductionSignal = reductionPctSoFar >= 0.05 ? 2 : reductionPctSoFar >= 0.02 ? 1 : 0;
        const totalSignal = domSignal + reductionSignal;
        if (totalSignal >= 3) stalenessDepth = 'deeply';
        else if (totalSignal >= 2) stalenessDepth = 'moderate';
        else stalenessDepth = 'barely';
      }

      let overrideTiers = null;
      if (listingFailed) {
        const compSupportedList = expectedMarket / medianRatio;
        const currentIsBelowComps = currentPrice < compSupportedList * 0.98;

        // REALISTIC reduction ranges (calibrated to actual agent practice):
        // - Light reset: 2-3% off current — tests the next price point, often crosses psychological barrier
        // - Moderate reset: 4-5% off current — meaningful signal to the market, attracts new buyer pool
        // - Aggressive: 6-8% off current — clear "we want to sell" move, generates fast activity
        //
        // HARD CEILING: never recommend more than 8% off current as a default cut.
        // If a home truly needs a >8% cut, the conversation is "delist and revisit" not "cut more."
        //
        // Staleness intelligence retained: position within each range based on how stale the listing is.
        // - Barely stale → bottom of each range (gentler cuts work)
        // - Moderately stale → middle of each range
        // - Deeply stale → top of each range (but never exceeding ceilings)
        let cuts;
        if (stalenessDepth === 'deeply') {
          cuts = { light: 0.97, moderate: 0.95, aggressive: 0.92 };  // 3% / 5% / 8% off current
        } else if (stalenessDepth === 'moderate') {
          cuts = { light: 0.975, moderate: 0.955, aggressive: 0.93 };  // 2.5% / 4.5% / 7% off current
        } else {
          cuts = { light: 0.98, moderate: 0.96, aggressive: 0.94 };  // 2% / 4% / 6% off current
        }

        let lightReset, moderateReset, aggressiveReset;

        if (currentIsBelowComps) {
          // All tiers below current — straight percentage cuts
          lightReset = roundPrice(currentPrice * cuts.light);
          moderateReset = roundPrice(currentPrice * cuts.moderate);
          aggressiveReset = roundPrice(currentPrice * cuts.aggressive);
        } else {
          // Failed at or above comp value — moderate tier can anchor to comp-supported if it falls
          // within the realistic range; otherwise use the percentage cut.
          lightReset = roundPrice(currentPrice * cuts.light);
          const compTargetMid = compSupportedList;
          const moderateCutPrice = currentPrice * cuts.moderate;
          // Use comp-supported price only if it's within realistic moderate-reset range (4-5% cut)
          moderateReset = (compTargetMid >= currentPrice * 0.94 && compTargetMid <= currentPrice * 0.97)
            ? roundPrice(compTargetMid)
            : roundPrice(moderateCutPrice);
          aggressiveReset = roundPrice(currentPrice * cuts.aggressive);
        }

        // POST-REDUCTION DOM ESTIMATES:
        // When a stale listing gets a real price cut, the listing gets fresh visibility
        // (portals flag "price reduced", showings restart). DOM after reduction is typically:
        // - Light reset (2-3%): 25-35 days (modest activity bump, may need follow-up cut)
        // - Moderate reset (4-5%): 14-21 days (real activity surge, often sells without further cuts)
        // - Aggressive (6-8%): 7-14 days (multiple offers, clears fast)
        // These DOM estimates are AFTER the price reduction takes effect, not total since original listing.
        const lightDom = stalenessDepth === 'deeply' ? 30 : stalenessDepth === 'moderate' ? 28 : 25;
        const moderateDom = stalenessDepth === 'deeply' ? 18 : 16;
        const aggressiveDom = 10;

        overrideTiers = [
          { name: 'Light Reset', listPrice: lightReset, psf: lightReset / targetSqft, expectedSale: lightReset * medianRatio, expectedDom: lightDom, prob60: 0.45, riskOfReduction: 0.45, override: true, isPostReduction: true, cutPct: (1 - cuts.light) },
          { name: 'Moderate Reset', listPrice: moderateReset, psf: moderateReset / targetSqft, expectedSale: moderateReset * medianRatio, expectedDom: moderateDom, prob60: 0.72, riskOfReduction: 0.20, override: true, isPostReduction: true, cutPct: (1 - cuts.moderate) },
          { name: 'Aggressive', listPrice: aggressiveReset, psf: aggressiveReset / targetSqft, expectedSale: aggressiveReset * medianRatio, expectedDom: aggressiveDom, prob60: 0.90, riskOfReduction: 0.05, override: true, isPostReduction: true, cutPct: (1 - cuts.aggressive) }
        ];

        tiers = overrideTiers;
      }

      currentListingOverride = {
        currentPrice, dom, reductions, showings, offers,
        staleness, listingFailed, failureReason,
        stalenessDepth, reductionAmount, originalListPrice, reductionPctSoFar,
        compRecommended: listMarket,
        compSupportedSale: expectedMarket,
        currentIsBelowComps: currentPrice < expectedMarket * 0.98 / medianRatio,
        wasOverridden: !!overrideTiers
      };
    }

    // ===== MANUAL PRICE OVERRIDE =====
    // Agent can override the recommended (middle) tier price at any time.
    // This respects Liz's judgment — she has information the data can't capture.
    let manualOverrideApplied = false;
    if (subject.manualPriceOverride && parseFloat(subject.manualPriceOverride) > 0) {
      const manualPrice = parseFloat(subject.manualPriceOverride);
      // Replace the Market/Reset tier with the manual price
      // Aggressive becomes manual × 1.04, Quick becomes manual × 0.97
      // (Smaller spread because manual override implies high confidence)
      const manualAggressive = roundPrice(manualPrice * 1.04);
      const manualQuick = roundPrice(manualPrice * 0.97);
      tiers = [
        { name: 'Aggressive', listPrice: manualAggressive, psf: manualAggressive / targetSqft, expectedSale: manualAggressive * medianRatio, expectedDom: Math.round(medianAdom * 1.8), prob60: 0.30, riskOfReduction: 0.60, manual: true },
        { name: 'Recommended', listPrice: roundPrice(manualPrice), psf: manualPrice / targetSqft, expectedSale: manualPrice * medianRatio, expectedDom: Math.round(medianAdom), prob60: 0.70, riskOfReduction: 0.20, manual: true },
        { name: 'Quick Sale', listPrice: manualQuick, psf: manualQuick / targetSqft, expectedSale: manualQuick * medianRatio, expectedDom: Math.round(medianAdom * 0.5), prob60: 0.90, riskOfReduction: 0.05, manual: true }
      ];
      manualOverrideApplied = true;
    }

    const monthlyCarry =
      (parseFloat(subject.monthlyHOA) || 0) +
      (parseFloat(subject.propertyTaxAnnual) || 0) / 12 +
      (parseFloat(subject.insuranceAnnual) || 0) / 12 +
      (parseFloat(subject.estMortgagePayment) || 0);

    // Inventory health
    const allSold = comps.filter(c => c.status === 'SLD');
    const allActive = comps.filter(c => c.status === 'ACT');
    const monthlySoldRate = allSold.length / 9; // assume 9 month window
    const monthsSupply = monthlySoldRate > 0 ? allActive.length / monthlySoldRate : 0;
    let invVerdict;
    if (monthsSupply < 3) invVerdict = { label: "Seller's Market", desc: "Strong demand, low inventory. Pricing can be aggressive.", color: 'var(--green)' };
    else if (monthsSupply < 6) invVerdict = { label: "Balanced Market", desc: "Steady demand. Price right and homes will move.", color: 'var(--gold)' };
    else invVerdict = { label: "Buyer's Market", desc: "High inventory relative to demand. Conservative pricing recommended.", color: 'var(--red)' };

    // Buyer agent outreach — agents with 2+ sold deals in dataset
    const agentDeals = {};
    comps.filter(c => c.status === 'SLD' && c.sellingAgent).forEach(c => {
      if (!agentDeals[c.sellingAgent]) agentDeals[c.sellingAgent] = { count: 0, latest: null };
      agentDeals[c.sellingAgent].count++;
      if (!agentDeals[c.sellingAgent].latest || c.closeDate > agentDeals[c.sellingAgent].latest) {
        agentDeals[c.sellingAgent].latest = c.closeDate;
      }
    });
    const buyerAgents = Object.entries(agentDeals)
      .filter(([name, d]) => d.count >= 2 && !name.toLowerCase().includes('non-member'))
      .map(([name, d]) => ({ name, count: d.count, latest: d.latest }))
      .sort((a,b) => b.count - a.count)
      .slice(0, 10);

    return {
      medianPsf, p90Psf, p10Psf, medianRatio, medianAdom,
      baseValue, adjustments, totalAdjustments, upgradeBoost,
      tiers, monthlyCarry, compCount: selected.length, cleanCompCount: cleanComps.length,
      soldCount: cleanComps.filter(c => c.status === 'SLD').length,
      pendingCount: cleanComps.filter(c => c.status === 'PND').length,
      activeCount: cleanComps.filter(c => c.status === 'ACT').length,
      expiredCount: cleanComps.filter(c => c.status === 'EXP').length,
      marketDirection, marketAdjPct: marketDirection.annualPct * (medianAdom / 365),
      monthsSupply, invVerdict, buyerAgents,
      aggressiveWasCapped,
      manualOverrideApplied,
      manualPriceNote: subject.manualPriceNote || '',
      currentListingOverride
    };
  }, [selected, subject, upgradeAdjustment, marketDirection, outlierInfo, comps]);

  const toggleComp = (id) => {
    setSelectedIds(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };
  const toggleUpgrade = (id) => setUpgrades(prev => ({ ...prev, [id]: { ...prev[id], checked: !prev[id]?.checked } }));
  const updateUpgradeValue = (id, value) => setUpgrades(prev => ({ ...prev, [id]: { ...prev[id], customValue: value } }));
  const selectAll = () => setSelectedIds(new Set(filteredComps.map(c => c.id)));
  const clearAll = () => setSelectedIds(new Set());
  const recommendedTier = analysis?.tiers[1];

  // ===========================================
  // AGENT VIEW
  // ===========================================
  if (mode === 'agent') {
    return (
      <div>
        <header className="masthead">
          <div className="container masthead-inner">
            <div>
              <div className="brand">The Liz Team <span className="brand-mark">·</span> CMA Intelligence</div>
              <div className="brand-sub">Comparative Market Analysis — v4 · Pricing Discipline System</div>
            </div>
            <div className="header-actions">
              {analysis && (
                <div className="mode-toggle">
                  <button className={`mode-btn ${mode==='agent'?'active':''}`} onClick={() => setMode('agent')}>Agent View</button>
                  <button className={`mode-btn ${mode==='seller'?'active':''}`} onClick={() => setMode('seller')}>Seller Report</button>
                </div>
              )}
              {(comps.length > 0 || subject.address) && (
                <button className="btn-danger" onClick={resetCMA}>+ New CMA</button>
              )}
            </div>
          </div>
        </header>

        <div className="container">
          <MLSGuide />

          <section className="section">
            <div className="section-num">01 · DATA</div>
            <h2 className="section-title">Import MLS comp data</h2>
            <p className="section-sub">Export sold + active + pending + expired comps from MLS as CSV. Click the MLS Search Setup guide above for exact parameters.</p>
            {comps.length === 0 ? (
              <div className={`upload-zone ${dragging?'drag':''}`}
                onClick={() => fileInputRef.current.click()}
                onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={(e) => { e.preventDefault(); setDragging(false); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); }}>
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">

                      <option value="needs_work">Original + Needs Work (−10%)</option>

                      <option value="above_avg">Above-Average Lot (+2%)</option>
                      <option value="standard">Standard Lot (baseline)</option>

                  <div className="field">

                  <div className="field">

                            <td className="price-cell">{c.spLpRatio ? (c.spLpRatio*100).toFixed(1)+'%' : '—'}</td>

          {comps.length > 0 && subject.sqft && selectedIds.size >= 2 && (
